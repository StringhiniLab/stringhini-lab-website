bio: |
 Sarah is a Research Scientist at the Stringhini Lab. Prior to joining, she completed her BSc Physiology & Neuroscience and MSc Rehabilitation Science at UBC. Sarah supports overall lab coordination and manages the following projects: intimate partner violence and functional aging, and parental leave policy impact on maternal and child health.

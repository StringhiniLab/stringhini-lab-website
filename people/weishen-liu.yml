bio: |
 Weishen is currently pursuing her PhD in Population and Public Health at SPPH under the supervision of Dr. Silvia Stringhini. She received her MSc in Neuropsychiatric Epidemiology from the Harvard T.H. Chan School of Public Health and her BA in Neuroscience from Bryn Mawr College before joining UBC. Her research focuses on brain aging, with a particular interest in investigating how socioeconomic conditions and environmental exposures across the life course contribute to aging-related cognitive decline and neurodegenerative diseases. She is also interested in integrating causal inference and machine learning approaches to better understand the mechanisms underlying the health inequities in brain aging.
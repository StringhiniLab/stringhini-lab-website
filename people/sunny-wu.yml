bio: |
  Sunny is a practicum student at the Stringhini Lab and a second-year Master of Public Health (MPH) student at the School of Population and Public Health. She also holds an HBSc in pharmacology from the University of Toronto. Sunny’s current project focuses on the role of social connectedness in mediating the relationship between socioeconomic conditions and functional aging among older adults in Canada. Outside the Lab, she enjoys hiking and watching films.
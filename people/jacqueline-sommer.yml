bio: |
 Jacqueline is an MSc student in the School of Population and Public Health at the University of British Columbia, supervised by Dr. Eva Oberle and Dr. Silvia Stringhini. She holds a Bachelor of Kinesiology from the University of British Columbia and is currently investigating the effects of exercise on ADHD-related outcomes in adults. Her research interests focus on mental health and the potential of exercise as a non-pharmacological approach to symptom management and treatment.
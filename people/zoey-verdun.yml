bio: |
 Dr. Zoey Verdun is a Postdoctoral Research Fellow in the Stringhini Laboratory at UBC’s School of Population and Public Health. Previously, she was a Research Associate at the Centre for Health Economics & Policy Innovation at Imperial College London, where her work was part of the NIHR Global Health Research Unit on Diabetes and Cardiovascular Disease in South Asians. There, she examined income-based inequalities in non-communicable disease (NCD) risk factors and preventive care among more than 200,000 adults in the South Asia Biobank, and the role of the built environment in NCD risk, including compliance with tobacco and alcohol zoning regulations around schools. She also designed a school-based behavioural intervention to improve adolescents’ diets and evaluated a community-based health promotion program, both focused on Sri Lanka. Dr. Verdun holds a PhD in Economics from the European University Institute, an MSc in Economics from the Vrije Universiteit Amsterdam, and a BA (Honours) in Economics with a Minor in Environmental Studies from the University of Victoria. Her doctoral research examined how people change their lifestyle behaviours after health events such as a heart attack or diabetes diagnosis, as well as household transitions to more plant-based diets.
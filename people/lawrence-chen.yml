bio: |
  Dr. Lawrence Chen is a Research Scientist with the Stringhini Laboratory at UBC's School of Population and Public Health. He holds a BSc in Psychology from the University of British Columbia and a PhD in Neuroscience from McGill University. His research experience has focused on using large, longitudinal, and international datasets to understand factors that shape health and development across the life course. His doctoral research examined how prenatal maternal mental health and genetic factors are associated with children's mental health and development. His current work examines how socioeconomic conditions and broader societal contexts shape health and aging across populations.


bio: | 
  Lawrence Chen is a Research Scientist with the Stringhini Laboratory at UBC’s School of Population and Public Health. He holds a BSc in Psychology from the University of British Columbia and a PhD in Neuroscience from McGill University. His doctoral research examined how prenatal maternal mental health and genetic factors contribute to children’s socioemotional and mental health outcomes. His current research focuses on the determinants of health and aging, using data from international population-based cohorts to investigate how socioeconomic conditions and broader societal contexts shape aging and health trajectories across populations.

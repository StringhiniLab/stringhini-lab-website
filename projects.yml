- path: https://spph.ubc.ca/dr-silvia-stringhini-awarded-602k-cihr-grant-to-study-the-long-term-health-impacts-of-parental-leave-in-canada/
  title: "The Health Impact of Parental Leave: Assessing the Effect of Policy Changes and Leave Uptake on Short- and Long-Term Maternal and Child Health Outcomes in Canada"
  author: "Stringhini, Silvia, Guhn, Martin; Mah, Sarah M; McDade, Thomas"
  subtitle: "Canadian Institutes of Health Research"
  description: "Parental leave policies provide time off work after childbirth and play an important role in supporting families and health. Research shows that paid leave improves short-term outcomes, such as reducing postpartum depression, lowering maternal hospital readmissions, and supporting early child development. However, we know much less about the long-term health effects of parental leave and whether it helps reduce health inequalities. This study will examine how the 2000 policy reform in Canada affected mothers’ physical and mental health in both the short and long term, including depression, hospital stays, and overall health years after childbirth. It will also assess how the 2000 and 2017 reforms influenced children’s early development and their health through adolescence and early adulthood."
  started: "2026"
  ended: "2031"
  funding: "$602,056"

- path: https://healthyaging.med.ubc.ca/news/edwin-s-h-leong-centre-for-healthy-aging-investigators-awarded-cihr-project-grants-in-fall-2025-competition
  title: "Unequal Ageing Trajectories Across the Life Course: Environmental Pathways, Protective Factors, and Actionable Levers"
  author: "Stringhini, Silvia, Kobor, Michael S; McLeod, Christopher B"
  subtitle: "Canadian Institutes of Health Research"
  description: "This project aims to provide crucial insights into how socioeconomic conditions throughout life influence the aging process and contribute to health disparities in later years. Aging outcomes-such as functional decline, disease onset, and biological aging-vary significantly across individuals, with those exposed to adverse socioeconomic conditions, such as poverty or low education, facing a greater risk of poor health as they age."
  started: "2025"
  ended: "2029"
  funding: "$719,000"
  
